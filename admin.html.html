<title>Admin Kelas 8 I</title>

<style>
  :root{
    --jungle-deep:#123524; --jungle-mid:#1F5E42; --leaf:#4FA875; --canopy-light:#A9E4B8;
    --sun:#FFCF3F; --mango:#F2905A; --cream:#FBF6E8; --bark:#7A5230; --ink:#173324;
    --muted:#557061; --line:#d3e5d8; --danger:#B4400C;
    --shadow:0 14px 30px -14px rgba(18,53,36,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Nunito',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif; color:var(--jungle-deep);}
  button,input,select,textarea{font:inherit; color:inherit;}
  [hidden]{display:none !important;}
  :focus-visible{outline:3px solid var(--jungle-mid); outline-offset:2px;}
  .side :focus-visible{outline-color:var(--sun);}

  /* ---------- Tombol ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem; line-height:1;
    padding:12px 22px; border-radius:999px; border:3px solid var(--jungle-deep);
    background:var(--sun); color:var(--jungle-deep); cursor:pointer; box-shadow:var(--shadow);
    transition:transform .2s ease; text-decoration:none;
  }
  .btn:hover{transform:translateY(-2px) rotate(-1deg);}
  .btn.soft{background:var(--canopy-light); border-color:transparent; box-shadow:none;}
  .btn.ghost{background:transparent; border-color:var(--line); box-shadow:none;}
  .btn.danger{background:#fff; color:var(--danger); border-color:#f0c4ad; box-shadow:none;}
  .btn.sm{padding:9px 16px; font-size:.92rem; border-width:2px;}
  .btn:disabled{opacity:.5; cursor:wait; transform:none;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:#fff;
    cursor:pointer; display:grid; place-items:center; font-size:1rem; flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--leaf); background:#f0faf3;}
  .icon-btn.danger:hover{border-color:#f0c4ad; background:#fff3ec;}
  .icon-btn:disabled{opacity:.3; cursor:not-allowed;}

  /* ---------- Login ---------- */
  .login{
    min-height:100vh; display:grid; place-items:center; padding:20px;
    background:radial-gradient(circle at 50% -10%, #2c6b48 0%, var(--jungle-deep) 62%);
  }
  .login-card{
    background:var(--cream); border-radius:32px; padding:34px 30px; width:min(400px,100%);
    text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.35);
  }
  .login-card .leaf{font-size:2.6rem;}
  .login-card h1{font-size:1.8rem; margin:4px 0 6px;}
  .login-card p{color:var(--muted); margin-bottom:18px; line-height:1.5;}
  .login-card .input{text-align:center; font-size:1.1rem;}
  .login-msg{color:var(--danger); font-weight:800; min-height:1.5em; margin:10px 0 6px;}
  .login-hint{font-size:.85rem; color:var(--muted); margin-top:14px;}

  /* ---------- Kerangka ---------- */
  .shell{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}
  .side{
    background:var(--jungle-deep); color:var(--cream); padding:22px 14px; display:flex; flex-direction:column;
    gap:4px; position:sticky; top:0; height:100vh; overflow:auto;
  }
  .side .brand{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.35rem; padding:4px 12px 18px;
    display:flex; gap:10px; align-items:center; line-height:1.1;
  }
  .side .brand small{display:block; font-family:'Nunito',sans-serif; font-weight:700; font-size:.8rem; color:var(--canopy-light);}
  .nav-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0;
    color:#DDEFE2; font-weight:800; padding:12px 14px; border-radius:14px; cursor:pointer; font-size:.98rem;
    text-decoration:none;
  }
  .nav-btn:hover{background:rgba(255,255,255,.09);}
  .nav-btn.active{background:var(--sun); color:var(--jungle-deep);}
  .nav-btn .dot{margin-left:auto; width:10px; height:10px; border-radius:50%; background:var(--mango);}
  .side .spacer{flex:1; min-height:16px;}
  .content{padding:30px clamp(16px,4vw,44px) 110px; max-width:1100px; width:100%;}
  .topbar{display:none;}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:55;}

  @media(max-width:860px){
    .shell{grid-template-columns:1fr;}
    .side{position:fixed; left:0; top:0; bottom:0; width:280px; z-index:60; transform:translateX(-105%); transition:transform .25s ease;}
    .side.open{transform:none;}
    .topbar{
      display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;
      background:var(--jungle-deep); color:var(--cream); padding:10px 16px; font-family:'Baloo 2',sans-serif;
      font-weight:800; font-size:1.15rem;
    }
    .topbar button{background:none; border:0; color:var(--cream); font-size:1.6rem; cursor:pointer; line-height:1; padding:4px 8px;}
  }

  .page-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px;}
  .page-head h1{font-size:clamp(1.8rem,4vw,2.5rem); line-height:1.1;}
  .page-head p{color:var(--muted); margin-top:8px; max-width:560px; line-height:1.55;}

  .panel{
    background:#fff; border:2px solid rgba(79,168,117,.18); border-radius:24px; padding:22px; box-shadow:var(--shadow);
  }
  .panel + .panel, .grad-card + .panel, .panel + .stat-grid, .stat-grid + .panel{margin-top:18px;}
  .panel h2{font-size:1.25rem; margin-bottom:12px;}
  .hint{color:var(--muted); font-size:.9rem; line-height:1.5;}

  /* ---------- Hitung mundur (dipakai juga di website) ---------- */
  .grad-card{
    position:relative; overflow:hidden; background:linear-gradient(140deg,#123524 0%,#1F5E42 100%);
    color:#FBF6E8; border-radius:34px; padding:32px 30px 26px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .grad-card h2{font-size:clamp(1.6rem,4vw,2.2rem); color:#FFCF3F; line-height:1.1;}
  .grad-date{margin-top:6px; font-weight:700; opacity:.85;}
  .grad-clock{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 26px;}
  .grad-unit{background:rgba(255,255,255,.08); border:2px solid rgba(169,228,184,.25); border-radius:26px 26px 26px 6px; padding:16px 6px 12px; text-align:center;}
  .grad-unit b{display:block; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(1.8rem,6vw,3.2rem); line-height:1; color:#FFCF3F; font-variant-numeric:tabular-nums;}
  .grad-unit span{display:block; margin-top:6px; font-weight:800; font-size:.85rem; color:#DDEFE2;}
  .grad-track{position:relative; height:14px; border-radius:999px; background:rgba(0,0,0,.28); margin:0 14px;}
  .grad-fill{height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#4FA875,#A9E4B8);}
  .grad-marker{position:absolute; top:50%; left:0; transform:translate(-50%,-56%); font-size:1.7rem; line-height:1;}
  .grad-foot{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:16px 0 0; font-weight:700; font-size:.9rem; color:#DDEFE2;}
  .grad-card .btn{margin-top:18px;}
  @media(max-width:560px){
    .grad-card{padding:24px 16px 20px; border-radius:26px;}
    .grad-clock{gap:8px;}
    .grad-unit{padding:12px 4px 9px; border-radius:18px 18px 18px 4px;}
    .grad-unit b{font-size:1.75rem;}
  }

  /* ---------- Ringkasan ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px;}
  .stat-tile{
    display:flex; align-items:center; gap:14px; text-align:left; background:#fff; cursor:pointer;
    border:2px solid rgba(79,168,117,.18); border-radius:20px 20px 20px 6px; padding:16px 18px;
  }
  .stat-tile:hover{border-color:var(--leaf);}
  .stat-tile .ico{width:48px; height:48px; border-radius:15px; background:var(--canopy-light); display:grid; place-items:center; font-size:1.4rem; flex-shrink:0;}
  .stat-tile b{display:block; font-family:'Baloo 2',sans-serif; font-size:1.7rem; line-height:1; color:var(--jungle-deep);}
  .stat-tile small{color:var(--muted); font-weight:700; font-size:.85rem;}
  .quick{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}

  /* ---------- Daftar ---------- */
  .row{display:flex; gap:14px; align-items:center; background:#fff; border:2px solid rgba(79,168,117,.16); border-radius:18px; padding:14px 16px; flex-wrap:wrap;}
  .row + .row{margin-top:10px;}
  .row .grow{flex:1; min-width:180px;}
  .row h3{font-size:1.05rem; line-height:1.25;}
  .row p{color:var(--muted); font-size:.9rem; margin-top:2px; overflow-wrap:anywhere;}
  .row .actions{display:flex; gap:6px; flex-shrink:0; margin-left:auto;}
  .row.lewat{opacity:.65;}
  .row.first{border-color:var(--sun); box-shadow:0 0 0 3px rgba(255,207,63,.25);}
  .datebox{width:56px; height:56px; border-radius:16px; background:var(--jungle-deep); color:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; line-height:1; flex-shrink:0;}
  .datebox .d{font-size:1.25rem;} .datebox .m{font-size:.7rem;}
  .tag{display:inline-block; font-size:.76rem; font-weight:800; border-radius:999px; padding:3px 11px; background:var(--canopy-light); color:var(--jungle-deep); margin-right:6px;}
  .tag.sun{background:#fff0b8;} .tag.mango{background:#fddbc8;} .tag.gray{background:#e7eee9; color:#4b6b5a;}
  .group-title{font-family:'Baloo 2',sans-serif; font-size:1.1rem; color:var(--jungle-deep); margin:26px 0 10px;}
  .group-title:first-of-type{margin-top:0;}

  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px;}
  .photo{background:#fff; border:2px solid rgba(79,168,117,.16); border-radius:22px 22px 22px 6px; overflow:hidden;}
  .photo img{width:100%; height:150px; object-fit:cover; display:block; background:var(--canopy-light);}
  .photo .meta{padding:12px 12px 12px; display:flex; flex-direction:column; gap:10px;}
  .photo .cap{font-weight:800; font-size:.93rem; overflow-wrap:anywhere;}
  .photo .actions{display:flex; gap:6px;}

  .empty{text-align:center; padding:44px 20px; background:#fff; border:2px dashed var(--leaf); border-radius:26px;}
  .empty .big{font-size:2.6rem;}
  .empty h3{font-size:1.3rem; margin:6px 0 4px;}
  .empty p{color:var(--muted); margin-bottom:16px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .chip{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.88rem; padding:7px 16px; border-radius:999px; background:var(--canopy-light); color:var(--jungle-deep); border:0; cursor:pointer;}
  .chip.active{background:var(--sun); box-shadow:var(--shadow);}
  .avatar{width:46px; height:46px; border-radius:50%; background:var(--canopy-light); display:grid; place-items:center; font-size:1.4rem; flex-shrink:0;}

  /* ---------- Jadwal ---------- */
  .jrow{display:grid; grid-template-columns:1fr 142px 142px auto; gap:10px; align-items:center;}
  .jrow + .jrow{margin-top:10px;}
  .jrow .actions{display:flex; gap:6px;}
  .jtime-sep{display:none;}
  @media(max-width:700px){
    .jrow{grid-template-columns:1fr 1fr; background:#f6fbf7; border-radius:16px; padding:12px;}
    .jrow > :first-child{grid-column:1 / -1;}
    .jrow .actions{grid-column:1 / -1; justify-content:flex-end;}
  }

  /* ---------- Formulir ---------- */
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field > label{font-weight:800; font-size:.93rem;}
  .input,.select,.textarea{
    width:100%; padding:11px 14px; border-radius:12px; border:2px solid var(--line); background:#fff;
    transition:border-color .15s, box-shadow .15s;
  }
  .input:focus,.select:focus,.textarea:focus{outline:none; border-color:var(--jungle-mid); box-shadow:0 0 0 3px rgba(79,168,117,.28);}
  .textarea{min-height:96px; resize:vertical; line-height:1.5;}
  .input[type=file]{padding:9px 12px; background:#f6fbf7;}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media(max-width:700px){.two,.split{grid-template-columns:1fr;}}
  .inline-emoji{display:flex; gap:8px;}
  .inline-emoji .input{width:96px; text-align:center; font-size:1.3rem;}

  .modal{position:fixed; inset:0; background:rgba(10,30,20,.6); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal-box{background:var(--cream); border-radius:28px; width:min(560px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.35);}
  .modal-box h2{font-size:1.45rem; margin-bottom:16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .mprev{width:100%; max-height:190px; object-fit:cover; border-radius:16px; margin-bottom:14px; display:block;}
  .mprevs{display:flex; gap:8px; flex-wrap:wrap; margin:-6px 0 14px;}
  .mprevs img{width:64px; height:64px; object-fit:cover; border-radius:12px;}
  @media(max-width:600px){
    .modal{align-items:flex-end; padding:0;}
    .modal-box{border-radius:28px 28px 0 0; max-height:92vh; width:100%;}
  }

  .toast{
    position:fixed; left:50%; bottom:86px; transform:translate(-50%,16px); background:var(--jungle-deep); color:#fff;
    padding:12px 22px; border-radius:999px; font-weight:800; z-index:200; opacity:0; visibility:hidden; pointer-events:none;
    transition:transform .25s ease, opacity .25s ease, visibility .25s;
    max-width:calc(100vw - 24px); text-align:center; box-shadow:0 14px 34px -10px rgba(0,0,0,.5);
  }
  .toast.show{transform:translate(-50%,0); opacity:1; visibility:visible;}
  .toast.err{background:var(--danger);}

  .pubbar{
    position:fixed; left:calc(50% + 130px); bottom:18px; transform:translateX(-50%); z-index:45; background:var(--jungle-deep);
    color:var(--cream); border-radius:999px; padding:9px 10px 9px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:0 18px 40px -14px rgba(0,0,0,.55); font-weight:800; max-width:calc(100vw - 24px); font-size:.95rem;
  }
  .pubbar i{width:10px; height:10px; border-radius:50%; background:var(--mango); display:inline-block; margin-right:8px;}
  @media(max-width:860px){ .pubbar{left:50%;} }

  .steps{margin:12px 0 4px 22px; line-height:1.7;}
  .steps li{margin-bottom:6px; padding-left:4px;}
  .status-line{display:flex; align-items:center; gap:10px; font-weight:800; margin:10px 0 16px;}
  .status-line i{width:12px; height:12px; border-radius:50%; background:var(--leaf); display:inline-block;}
  .status-line.dirty i{background:var(--mango);}
  .btn-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
  code{background:#eaf5ed; padding:2px 7px; border-radius:7px; font-size:.9em;}
  @media(prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

}

const todayStr = () => { const n = new Date(); return n.getFullYear() + '-' + pad(n.getMonth()+1) + '-' + pad(n.getDate()); };
function tgl(str){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || ''); if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3]; return {y, mo, d, dt:new Date(y, mo-1, d)};
}
const tglPanjang = str => { const t = tgl(str); return t ? HARI_N[t.dt.getDay()] + ', ' + t.d + ' ' + BLN_P[t.mo-1] + ' ' + t.y : ''; };

  return '<div class="grad-card"><h2 id="cd-judul"></h2><p class="grad-date" id="cd-date"></p>' + clockHTML()

function updateClock(){
  const dEl = $('#cd-d'); if (!dEl) return;
  const K = state.kelulusan;
  const t = Date.parse(K.tanggal + 'T' + (K.jam || '08:00') + ':00+07:00');
  const s = Date.parse((K.mulai || '2025-07-14') + 'T00:00:00+07:00');
  $('#cd-judul').textContent = K.judul || 'Hitung mundur kelulusan';
  $('#cd-msg').textContent = K.pesan || '';
  if (isNaN(t)) { $('#cd-date').textContent = 'Tanggal kelulusan belum diisi'; return; }
  $('#cd-date').textContent = tglPanjang(K.tanggal) + ' • pukul ' + (K.jam || '08:00').replace(':','.') + ' WIB';
  const diff = Math.max(0, t - Date.now());
  dEl.textContent = Math.floor(diff / 864e5);
  $('#cd-h').textContent = pad(Math.floor(diff % 864e5 / 36e5));
  $('#cd-m').textContent = pad(Math.floor(diff % 36e5 / 6e4));
  $('#cd-s').textContent = pad(Math.floor(diff % 6e4 / 1e3));
  const pct = (isNaN(s) || t <= s) ? 0 : Math.max(0, Math.min(100, (Date.now() - s) / (t - s) * 100));
  $('#cd-fill').style.width = pct + '%'; $('#cd-mark').style.left = pct + '%';
  $('#cd-pct').textContent = diff === 0 ? 'Selamat lulus! 🎓' : Math.floor(pct) + '% perjalanan sudah dilewati';
}

function fileToDataURL(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const sc = Math.min(1, (maxSide || 1000) / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality || .72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function download(){
  flush();
  const out = Object.assign({}, state, {diperbarui: new Date().toISOString()});
  const text = '// File ini dibuat oleh Admin Kelas 8 I. Timpa data.js lama dengan file ini.\nwindow.KELAS_DATA = ' + JSON.stringify(out, null, 2) + ';\n';
  const a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  baseline = JSON.stringify(state); store.set(LS.base, baseline);
  render(); toast('data.js sudah diunduh. Ganti file lama, lalu muat ulang website.');
}
function parseDataFile(text){
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('format');
  const o = JSON.parse(text.slice(a, b + 1));
  if (typeof o !== 'object' || !Array.isArray(o.galeri) || !Array.isArray(o.siswa)) throw new Error('isi');
  return o;
}

function move(list, id, dir){
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const t = list[i]; list[i] = list[j]; list[j] = t; persist(); render();
}
function remove(list, id, what){
  const i = list.findIndex(x => x.id === id); if (i < 0) return;
  if (!confirm('Hapus ' + what + '? Ini tidak bisa dibatalkan.')) return;
  list.splice(i, 1); persist(); render(); toast('Sudah dihapus');
}

};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (el && ACTS[el.dataset.act]) { e.preventDefault(); ACTS[el.dataset.act](el); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) { setPath(state, t.dataset.bind, t.dataset.num ? (Number(t.value) || 0) : t.value); updateClock(); queuePersist(); }
  else if (t.dataset.jk) {
    const row = t.closest('.jrow'); const item = state.jadwal[jadwalDay][+row.dataset.i]; if (item) { item[t.dataset.jk] = t.value; queuePersist(); }
  }
  else if (t.id === 'siswaQ') { siswaQ = t.value; renderSiswaList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.roleId) { const s = state.siswa.find(x => x.id === t.dataset.roleId); if (s) { s.peran = t.value; persist(); renderSiswaList(); toast('Peran diperbarui'); } }
  else if (t.id === 'importFile' && t.files[0]) {
    const f = t.files[0]; const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = parseDataFile(String(fr.result));
        if (!confirm('Ganti draf sekarang dengan isi file ' + f.name + '?')) return;
        state = normalize(o); persist(); render(); toast('File berhasil diimpor');
      } catch (err) { toast('File tidak bisa dibaca. Pakai data.js yang dibuat oleh halaman admin ini.', 'err'); }
    };
    fr.readAsText(f); t.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else closeDrawer(); }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
$('#menuBtn').addEventListener('click', openDrawer);
$('#scrim').addEventListener('click', closeDrawer);
window.addEventListener('pagehide', flush);

/* =====================================================================
   MASUK (PIN)
   ===================================================================== */
function hash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function tryLogin(){
  const stored = store.get(LS.pin) || hash(DEFAULT_PIN);
  if (hash($('#pin').value) === stored) { sess.set(true); showApp(); }
  else { $('#loginMsg').textContent = 'PIN belum tepat. Coba lagi.'; $('#pin').select(); }
}
function showLogin(){
  $('#login').hidden = false; $('#app').hidden = true;
  $('#loginHint').hidden = !!store.get(LS.pin);
  $('#loginBtn').onclick = tryLogin;
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  $('#pin').focus();
}
function showApp(){
  $('#login').hidden = true; $('#app').hidden = false;
  $('#nav').innerHTML = NAV.map(n => '<button class="nav-btn" data-act="go" data-view="' + n[0] + '" type="button"><span>' + n[1] + '</span><span>' + n[2] + '</span>' + (n[0] === 'terbit' ? '<i class="dot" id="navDot" hidden></i>' : '') + '</button>').join('');
  render();
}
sess.get() ? showApp() : showLogin();

})();
</script>
